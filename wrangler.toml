# 青词天路 · 四级全卷修仙 —— Cloudflare Workers 部署配置
#
# 部署命令：npx wrangler deploy
# 本地调试：npx wrangler dev --local --port 8787
#
# 注意：Pages 部署使用独立的 wrangler.pages.toml（wrangler 不支持指定配置文件路径，
# 因此 Pages 部署时请临时切换文件名，或直接使用 npm run deploy:pages 脚本）。

name = "qingci-cet4-xiuxian"
main = "worker/index.mjs"
compatibility_date = "2026-09-30"

# 账户信息（wrangler 读取本机已登录账号）
account_id = "2285eea4a9744659705f3cc8c47c7acd"

# 静态资源绑定：deploy/ 目录作为 ASSETS 提供给 Worker
# 运行 `npm run prepare:deploy` 生成 deploy/ 后再部署
[assets]
directory = "deploy"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# 须与 package.json 的 version 保持一致。
# Pages 部署时由 scripts/deploy-pages.mjs 自动写入本次版本；
# 直连 `wrangler pages deploy` 时则依赖此处的值 —— 此处曾长期停留在 1.6.0，
# 导致 /healthz 与 /api/meta 回报旧版本号（静态文件是新的，只有 Functions 的 env 是旧的）。
APP_VERSION = "1.8.1"

# 反馈与道友小组的 D1 绑定（Pages 部署时由 scripts/deploy-pages.mjs 写入同样的绑定）
# 建库与建表：
#   npx wrangler d1 create qingci-feedback
#   npx wrangler d1 execute qingci-feedback --remote --file=db/schema.sql
# 可选加密盐（建议配置）：npx wrangler pages secret put FEEDBACK_SALT
[[d1_databases]]
binding = "DB"
database_name = "qingci-feedback"
database_id = "a4eff653-dcfd-4874-a0ff-e30f5e92a611"
